<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17211e">
  <meta name="description" content="اقرأ كتاب الشركة الناشئة المرنة لإريك ريس، كاملًا كما ورد في ملف PDF المرفق.">
  <title>الشركة الناشئة المرنة — إريك ريس</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: #17211e; color: #f5f7f6; }
    header { min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .7rem clamp(1rem, 4vw, 3rem); background: #fff; color: #17211e; }
    .book-title { min-width: 0; }
    h1 { margin: 0; font-size: clamp(1rem, 2.3vw, 1.35rem); line-height: 1.4; }
    .byline { margin: .1rem 0 0; color: #59645f; font-size: .9rem; }
    .open-pdf { flex: 0 0 auto; border-radius: 999px; padding: .58rem 1rem; background: #176c59; color: #fff; text-decoration: none; font-size: .9rem; }
    .open-pdf:hover, .open-pdf:focus-visible { background: #105342; }
    main { flex: 1; min-height: 0; padding: .65rem clamp(.25rem, 2vw, 1rem) 0; }
    iframe { display: block; width: 100%; height: 100%; border: 0; border-radius: .65rem .65rem 0 0; background: #fff; }
    .fallback { padding: 1rem; text-align: center; color: #fff; }
    .fallback a { color: #a9e4d3; }
    @media (max-width: 520px) {
      header { min-height: 60px; padding-inline: .8rem; }
      .byline { font-size: .78rem; }
      .open-pdf { padding: .5rem .75rem; font-size: .8rem; }
      main { padding: .35rem .2rem 0; }
      iframe { border-radius: .45rem .45rem 0 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="book-title">
      <h1>الشركة الناشئة المرنة</h1>
      <p class="byline">إريك ريس · النص والرسوم والجداول من ملف الكتاب</p>
    </div>
    <a class="open-pdf" href="lean-startup.pdf" target="_blank" rel="noopener">فتح ملف الكتاب</a>
  </header>
  <main aria-label="قارئ الكتاب">
    <iframe title="كتاب الشركة الناشئة المرنة بصيغة PDF" src="lean-startup.pdf#view=FitH&amp;toolbar=1&amp;navpanes=0">
      <p class="fallback">تعذر عرض الكتاب داخل الصفحة. <a href="lean-startup.pdf">افتح ملف PDF</a>.</p>
    </iframe>
  </main>
</body>
</html>
